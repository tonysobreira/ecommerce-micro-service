server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin, RETAIN_FIRST
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOriginPatterns:
              - "http://localhost:4200"
              - "http://127.0.0.1:4200"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            exposedHeaders:
              - Authorization
              - Content-Type
            allowCredentials: true
            maxAge: 3600
      discovery:
        locator:
          enabled: false   # <<< IMPORTANT: disable auto routes
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/auth/**

        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/users/**

        - id: product-service
          uri: lb://product-service
          predicates:
            - Path=/products/**,/categories/**,/product-images/**

        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/orders/**

        - id: email-service
          uri: lb://email-service
          predicates:
            - Path=/emails/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

security:
  jwt:
    # must be 32+ chars/bytes for HS256
    secret: ${JWT_SECRET:dev-jwt-secret-32-bytes-long-123456}

management:
  endpoints:
    web:
      exposure:
        include: health,info
