server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin, RETAIN_FIRST
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOriginPatterns:
              - "http://localhost:4200"
              - "http://127.0.0.1:4200"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            exposedHeaders:
              - Authorization
              - Content-Type
            allowCredentials: true
            maxAge: 3600
      discovery:
        locator:
          enabled: false   # <<< IMPORTANT: disable auto routes
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/auth/**

        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/users/**

        - id: product-service
          uri: lb://product-service
          predicates:
            - Path=/products/**,/categories/**,/product-images/**

        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/orders/**

        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/payments/**

        - id: email-service
          uri: lb://email-service
          predicates:
            - Path=/emails/**

        - id: cart-service
          uri: lb://cart-service
          predicates:
            - Path=/cart/**

        # Centralized OpenAPI docs per service (aggregated in gateway swagger-ui)
        - id: auth-service-docs
          uri: lb://auth-service
          predicates:
            - Path=/v3/api-docs/auth
          filters:
            - SetPath=/v3/api-docs

        - id: user-service-docs
          uri: lb://user-service
          predicates:
            - Path=/v3/api-docs/user
          filters:
            - SetPath=/v3/api-docs

        - id: product-service-docs
          uri: lb://product-service
          predicates:
            - Path=/v3/api-docs/product
          filters:
            - SetPath=/v3/api-docs

        - id: order-service-docs
          uri: lb://order-service
          predicates:
            - Path=/v3/api-docs/order
          filters:
            - SetPath=/v3/api-docs

        - id: payment-service-docs
          uri: lb://payment-service
          predicates:
            - Path=/v3/api-docs/payment
          filters:
            - SetPath=/v3/api-docs

        - id: email-service-docs
          uri: lb://email-service
          predicates:
            - Path=/v3/api-docs/email
          filters:
            - SetPath=/v3/api-docs

        - id: cart-service-docs
          uri: lb://cart-service
          predicates:
            - Path=/v3/api-docs/cart
          filters:
            - SetPath=/v3/api-docs

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: auth-service
        url: /v3/api-docs/auth
      - name: user-service
        url: /v3/api-docs/user
      - name: product-service
        url: /v3/api-docs/product
      - name: order-service
        url: /v3/api-docs/order
      - name: payment-service
        url: /v3/api-docs/payment
      - name: email-service
        url: /v3/api-docs/email
      - name: cart-service
        url: /v3/api-docs/cart


eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

security:
  jwt:
    # must be 32+ chars/bytes for HS256
    secret: ${JWT_SECRET:dev-jwt-secret-32-bytes-long-123456}

management:
  endpoints:
    web:
      exposure:
        include: health,info
