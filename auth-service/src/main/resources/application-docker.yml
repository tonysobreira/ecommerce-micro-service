server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/authdb}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
  mail:
    host: ${MAIL_HOST:mailhog}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://eureka-server:8761/eureka}

security:
  jwt:
    secret: ${JWT_SECRET:dev-jwt-secret-32-bytes-long-123456}
    access-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:15}
    refresh-ttl-days: ${JWT_REFRESH_TTL_DAYS:7}
    issuer: ${JWT_ISSUER:ecommerce-ms}
  activation:
    ttl-hours: ${ACTIVATION_TTL_HOURS:24}

app:
  activation:
    base-url: ${ACTIVATION_BASE_URL:http://localhost:8080/auth/activate}
  mail:
    from: ${MAIL_FROM:no-reply@ecommerce.local}

management:
  endpoints:
    web:
      exposure:
        include: health,info
