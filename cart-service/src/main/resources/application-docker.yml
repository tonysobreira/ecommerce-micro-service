server:
  port: 8087

spring:
  application:
    name: cart-service
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://mongodb:27017/cartdb}

feign:
  client:
    config:
      default:
        connectTimeout: 3000
        readTimeout: 8000

product-service:
  name: product-service

inventory-service:
  name: inventory-service

order-service:
  name: order-service

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://discovery-server:8761/eureka}

security:
  jwt:
    secret: ${JWT_SECRET:dev-jwt-secret-32-bytes-long-123456}
    issuer: ${JWT_ISSUER:ecommerce-ms}

management:
  endpoints:
    web:
      exposure:
        include: health,info
