<svg xmlns="http://www.w3.org/2000/svg" width="2100" height="1280" viewBox="0 0 2100 1280">
  <defs>
    <style>
      .title { font: 700 46px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 22px Arial, sans-serif; fill: #334155; }
      .section { font: 700 24px Arial, sans-serif; fill: #0f172a; }
      .label { font: 700 20px Arial, sans-serif; fill: #0f172a; }
      .meta { font: 17px Arial, sans-serif; fill: #334155; }
      .note { font: 15px Arial, sans-serif; fill: #475569; }
      .box { stroke-width: 2.5; rx: 14; ry: 14; }
      .lane { stroke: #cbd5e1; stroke-width: 2.2; stroke-dasharray: 10 8; rx: 18; ry: 18; }
      .route { stroke: #2563eb; stroke-width: 3; fill: none; marker-end: url(#arrowBlue); }
      .discovery { stroke: #0f766e; stroke-width: 2.6; fill: none; stroke-dasharray: 8 7; marker-end: url(#arrowTeal); }
      .interservice { stroke: #b45309; stroke-width: 2.8; fill: none; marker-end: url(#arrowOrange); }
      .infra { stroke: #7c3aed; stroke-width: 2.8; fill: none; marker-end: url(#arrowPurple); }
    </style>

    <marker id="arrowBlue" markerWidth="11" markerHeight="11" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb" />
    </marker>
    <marker id="arrowTeal" markerWidth="11" markerHeight="11" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#0f766e" />
    </marker>
    <marker id="arrowOrange" markerWidth="11" markerHeight="11" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#b45309" />
    </marker>
    <marker id="arrowPurple" markerWidth="11" markerHeight="11" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#7c3aed" />
    </marker>
  </defs>

  <rect x="20" y="20" width="2060" height="1240" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2" rx="18" />
  <text x="1050" y="80" text-anchor="middle" class="title">E-commerce Microservices Architecture</text>
  <text x="1050" y="115" text-anchor="middle" class="subtitle">Updated with Cart Service + MongoDB + pgAdmin and current service ports/routes</text>

  <!-- lanes -->
  <rect class="lane" x="60" y="160" width="510" height="960" fill="#eff6ff" />
  <text x="85" y="198" class="section">Client + Entry</text>

  <rect class="lane" x="600" y="160" width="1090" height="960" fill="#fff7ed" />
  <text x="625" y="198" class="section">Discovery + Business Services</text>

  <rect class="lane" x="1720" y="160" width="330" height="960" fill="#faf5ff" />
  <text x="1745" y="198" class="section">Infrastructure</text>

  <!-- entry -->
  <rect class="box" fill="#dbeafe" stroke="#3b82f6" x="130" y="280" width="180" height="95" />
  <text x="220" y="320" text-anchor="middle" class="label">Frontend</text>
  <text x="220" y="348" text-anchor="middle" class="meta">Angular :4200</text>

  <rect class="box" fill="#bfdbfe" stroke="#2563eb" x="350" y="280" width="190" height="95" />
  <text x="445" y="320" text-anchor="middle" class="label">API Gateway</text>
  <text x="445" y="348" text-anchor="middle" class="meta">:8080</text>

  <!-- discovery -->
  <rect class="box" fill="#ccfbf1" stroke="#0f766e" x="1035" y="250" width="220" height="95" />
  <text x="1145" y="290" text-anchor="middle" class="label">Eureka Server</text>
  <text x="1145" y="318" text-anchor="middle" class="meta">:8761</text>

  <!-- services row 1 -->
  <rect class="box" fill="#ffedd5" stroke="#f97316" x="670" y="420" width="215" height="95" />
  <text x="777" y="458" text-anchor="middle" class="label">Auth Service</text>
  <text x="777" y="485" text-anchor="middle" class="meta">:8081</text>

  <rect class="box" fill="#ffedd5" stroke="#f97316" x="915" y="420" width="215" height="95" />
  <text x="1022" y="458" text-anchor="middle" class="label">User Service</text>
  <text x="1022" y="485" text-anchor="middle" class="meta">:8082</text>

  <rect class="box" fill="#ffedd5" stroke="#f97316" x="1160" y="420" width="215" height="95" />
  <text x="1267" y="458" text-anchor="middle" class="label">Product Service</text>
  <text x="1267" y="485" text-anchor="middle" class="meta">:8083</text>

  <rect class="box" fill="#ffedd5" stroke="#f97316" x="1405" y="420" width="215" height="95" />
  <text x="1512" y="458" text-anchor="middle" class="label">Email Service</text>
  <text x="1512" y="485" text-anchor="middle" class="meta">:8086</text>

  <!-- services row 2 -->
  <rect class="box" fill="#ffedd5" stroke="#f97316" x="760" y="610" width="215" height="95" />
  <text x="867" y="648" text-anchor="middle" class="label">Order Service</text>
  <text x="867" y="675" text-anchor="middle" class="meta">:8084</text>

  <rect class="box" fill="#ffedd5" stroke="#f97316" x="1005" y="610" width="215" height="95" />
  <text x="1112" y="648" text-anchor="middle" class="label">Payment Service</text>
  <text x="1112" y="675" text-anchor="middle" class="meta">:8085</text>

  <rect class="box" fill="#ffedd5" stroke="#f97316" x="1250" y="610" width="215" height="95" />
  <text x="1357" y="648" text-anchor="middle" class="label">Cart Service</text>
  <text x="1357" y="675" text-anchor="middle" class="meta">:8087</text>

  <!-- infra -->
  <rect class="box" fill="#ede9fe" stroke="#7c3aed" x="1765" y="350" width="240" height="100" />
  <text x="1885" y="390" text-anchor="middle" class="label">PostgreSQL</text>
  <text x="1885" y="418" text-anchor="middle" class="meta">:5432</text>

  <rect class="box" fill="#ede9fe" stroke="#7c3aed" x="1765" y="500" width="240" height="100" />
  <text x="1885" y="540" text-anchor="middle" class="label">MongoDB</text>
  <text x="1885" y="568" text-anchor="middle" class="meta">:27017</text>

  <rect class="box" fill="#ede9fe" stroke="#7c3aed" x="1765" y="650" width="240" height="120" />
  <text x="1885" y="690" text-anchor="middle" class="label">MailHog</text>
  <text x="1885" y="718" text-anchor="middle" class="meta">SMTP :1025</text>
  <text x="1885" y="744" text-anchor="middle" class="meta">UI :8025</text>

  <rect class="box" fill="#ede9fe" stroke="#7c3aed" x="1765" y="820" width="240" height="100" />
  <text x="1885" y="860" text-anchor="middle" class="label">pgAdmin</text>
  <text x="1885" y="888" text-anchor="middle" class="meta">:8090</text>

  <!-- route flow -->
  <path class="route" d="M310 327 L350 327" />
  <path class="route" d="M540 327 L620 327 L620 468 L670 468" />
  <path class="route" d="M620 327 L620 468 L915 468" />
  <path class="route" d="M620 327 L620 468 L1160 468" />
  <path class="route" d="M620 327 L620 468 L1405 468" />
  <path class="route" d="M620 327 L620 657 L760 657" />
  <path class="route" d="M620 327 L620 657 L1005 657" />
  <path class="route" d="M620 327 L620 657 L1250 657" />

  <!-- route list -->
  <rect x="120" y="430" width="420" height="360" fill="#ffffff" stroke="#93c5fd" stroke-width="2" rx="12" />
  <text x="145" y="462" class="section">Gateway Routes</text>
  <text x="145" y="494" class="meta">/auth/**              → auth-service</text>
  <text x="145" y="526" class="meta">/users/**             → user-service</text>
  <text x="145" y="558" class="meta">/products/**          → product-service</text>
  <text x="145" y="590" class="meta">/categories/**        → product-service</text>
  <text x="145" y="622" class="meta">/product-images/**    → product-service</text>
  <text x="145" y="654" class="meta">/orders/**            → order-service</text>
  <text x="145" y="686" class="meta">/payments/**          → payment-service</text>
  <text x="145" y="718" class="meta">/notifications/**            → notification-service</text>
  <text x="145" y="750" class="meta">/cart/**              → cart-service</text>

  <!-- discovery connections -->
  <path class="discovery" d="M445 280 L1085 260" />
  <path class="discovery" d="M777 420 L1085 345" />
  <path class="discovery" d="M1022 420 L1125 345" />
  <path class="discovery" d="M1267 420 L1165 345" />
  <path class="discovery" d="M1512 420 L1205 345" />
  <path class="discovery" d="M867 610 L1090 345" />
  <path class="discovery" d="M1112 610 L1145 345" />
  <path class="discovery" d="M1357 610 L1200 345" />

  <!-- inter-service calls -->
  <path class="interservice" d="M975 645 L1005 645" />
  <text x="990" y="625" text-anchor="middle" class="note">order → payment</text>

  <path class="interservice" d="M975 675 L1250 675" />
  <text x="1110" y="700" text-anchor="middle" class="note">order → cart</text>

  <path class="interservice" d="M1220 645 L1250 628" />
  <text x="1235" y="615" text-anchor="middle" class="note">payment → cart</text>

  <path class="interservice" d="M975 628 L1160 468" />
  <text x="1038" y="575" text-anchor="middle" class="note">order → product</text>

  <path class="interservice" d="M1220 628 L1160 495" />
  <text x="1210" y="560" text-anchor="middle" class="note">payment → product</text>

  <path class="interservice" d="M867 610 L1405 515" />
  <text x="1120" y="542" text-anchor="middle" class="note">order → email</text>

  <path class="interservice" d="M777 515 L1405 452" />
  <text x="1095" y="472" text-anchor="middle" class="note">auth → email</text>

  <!-- infra dependencies -->
  <path class="infra" d="M885 468 L1765 370" />
  <path class="infra" d="M1130 468 L1765 385" />
  <path class="infra" d="M1375 468 L1765 400" />
  <path class="infra" d="M975 657 L1765 415" />
  <path class="infra" d="M1220 657 L1765 430" />
  <path class="infra" d="M1465 657 L1765 550" />
  <path class="infra" d="M1620 468 L1765 700" />

  <!-- legend -->
  <rect x="650" y="870" width="1030" height="220" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" rx="12" />
  <text x="680" y="910" class="section">Legend</text>

  <line x1="680" y1="945" x2="790" y2="945" class="route" />
  <text x="810" y="951" class="meta">Gateway request flow</text>

  <line x1="680" y1="980" x2="790" y2="980" class="discovery" />
  <text x="810" y="986" class="meta">Service registration/discovery (Eureka)</text>

  <line x1="1180" y1="945" x2="1290" y2="945" class="interservice" />
  <text x="1310" y="951" class="meta">Inter-service calls</text>

  <line x1="1180" y1="980" x2="1290" y2="980" class="infra" />
  <text x="1310" y="986" class="meta">Database / tools / SMTP dependencies</text>

  <text x="680" y="1030" class="note">Host-exposed ports include 8080, 8761, 5432, 27017, 8025, 8090. Service ports are internal on Docker network.</text>
</svg>
