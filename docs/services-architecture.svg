<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1200" viewBox="0 0 1900 1200">
  <defs>
    <style>
      .title { font: 700 48px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 24px Arial, sans-serif; fill: #334155; }
      .section { font: 700 24px Arial, sans-serif; fill: #0f172a; }
      .label { font: 700 22px Arial, sans-serif; fill: #0f172a; }
      .meta { font: 18px Arial, sans-serif; fill: #334155; }
      .note { font: 16px Arial, sans-serif; fill: #475569; }
      .box { stroke-width: 2.5; rx: 16; ry: 16; }
      .lane { stroke: #cbd5e1; stroke-width: 2.5; stroke-dasharray: 12 8; rx: 20; ry: 20; }
      .route { stroke: #2563eb; stroke-width: 3; fill: none; marker-end: url(#arrowBlue); }
      .discovery { stroke: #0f766e; stroke-width: 2.6; fill: none; stroke-dasharray: 8 6; marker-end: url(#arrowTeal); }
      .interservice { stroke: #b45309; stroke-width: 2.8; fill: none; marker-end: url(#arrowOrange); }
      .infra { stroke: #7c3aed; stroke-width: 2.8; fill: none; marker-end: url(#arrowPurple); }
    </style>

    <marker id="arrowBlue" markerWidth="11" markerHeight="11" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb" />
    </marker>
    <marker id="arrowTeal" markerWidth="11" markerHeight="11" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#0f766e" />
    </marker>
    <marker id="arrowOrange" markerWidth="11" markerHeight="11" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#b45309" />
    </marker>
    <marker id="arrowPurple" markerWidth="11" markerHeight="11" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#7c3aed" />
    </marker>
  </defs>

  <rect x="20" y="20" width="1860" height="1160" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2" rx="20" />
  <text x="950" y="80" text-anchor="middle" class="title">E-commerce Microservices Architecture</text>
  <text x="950" y="118" text-anchor="middle" class="subtitle">Readable version: separated lanes, less crossing, larger labels</text>

  <!-- Lanes -->
  <rect class="lane" x="60" y="170" width="470" height="900" fill="#eff6ff" />
  <text x="85" y="208" class="section">Client + Entry Layer</text>

  <rect class="lane" x="560" y="170" width="980" height="900" fill="#fff7ed" />
  <text x="585" y="208" class="section">Business Services + Discovery</text>

  <rect class="lane" x="1560" y="170" width="300" height="900" fill="#faf5ff" />
  <text x="1585" y="208" class="section">Infrastructure</text>

  <!-- Entry -->
  <rect class="box" fill="#dbeafe" stroke="#3b82f6" x="120" y="280" width="170" height="95" />
  <text x="205" y="320" text-anchor="middle" class="label">Frontend</text>
  <text x="205" y="348" text-anchor="middle" class="meta">Angular</text>

  <rect class="box" fill="#bfdbfe" stroke="#2563eb" x="320" y="280" width="180" height="95" />
  <text x="410" y="320" text-anchor="middle" class="label">API Gateway</text>
  <text x="410" y="348" text-anchor="middle" class="meta">:8080</text>

  <!-- Eureka -->
  <rect class="box" fill="#ccfbf1" stroke="#0f766e" x="890" y="260" width="220" height="95" />
  <text x="1000" y="300" text-anchor="middle" class="label">Eureka Server</text>
  <text x="1000" y="328" text-anchor="middle" class="meta">:8761</text>

  <!-- Services row 1 -->
  <rect class="box" fill="#ffedd5" stroke="#f97316" x="640" y="430" width="220" height="100" />
  <text x="750" y="470" text-anchor="middle" class="label">Auth Service</text>
  <text x="750" y="500" text-anchor="middle" class="meta">:8081</text>

  <rect class="box" fill="#ffedd5" stroke="#f97316" x="890" y="430" width="220" height="100" />
  <text x="1000" y="470" text-anchor="middle" class="label">User Service</text>
  <text x="1000" y="500" text-anchor="middle" class="meta">:8082</text>

  <rect class="box" fill="#ffedd5" stroke="#f97316" x="1140" y="430" width="220" height="100" />
  <text x="1250" y="470" text-anchor="middle" class="label">Product Service</text>
  <text x="1250" y="500" text-anchor="middle" class="meta">:8083</text>

  <!-- Services row 2 -->
  <rect class="box" fill="#ffedd5" stroke="#f97316" x="640" y="620" width="220" height="100" />
  <text x="750" y="660" text-anchor="middle" class="label">Email Service</text>
  <text x="750" y="690" text-anchor="middle" class="meta">container :8085</text>

  <rect class="box" fill="#ffedd5" stroke="#f97316" x="890" y="620" width="220" height="100" />
  <text x="1000" y="660" text-anchor="middle" class="label">Order Service</text>
  <text x="1000" y="690" text-anchor="middle" class="meta">:8084</text>

  <rect class="box" fill="#ffedd5" stroke="#f97316" x="1140" y="620" width="220" height="100" />
  <text x="1250" y="660" text-anchor="middle" class="label">Payment Service</text>
  <text x="1250" y="690" text-anchor="middle" class="meta">:8085</text>

  <!-- Infra -->
  <rect class="box" fill="#ede9fe" stroke="#7c3aed" x="1600" y="440" width="220" height="110" />
  <text x="1710" y="484" text-anchor="middle" class="label">PostgreSQL</text>
  <text x="1710" y="516" text-anchor="middle" class="meta">:5432</text>

  <rect class="box" fill="#ede9fe" stroke="#7c3aed" x="1600" y="610" width="220" height="140" />
  <text x="1710" y="654" text-anchor="middle" class="label">MailHog</text>
  <text x="1710" y="684" text-anchor="middle" class="meta">SMTP :1025</text>
  <text x="1710" y="712" text-anchor="middle" class="meta">UI :8025</text>

  <!-- Core traffic -->
  <path class="route" d="M290 327 L320 327" />
  <path class="route" d="M500 327 L590 327 L590 480 L640 480" />
  <path class="route" d="M590 327 L590 480 L890 480" />
  <path class="route" d="M590 327 L590 480 L1140 480" />
  <path class="route" d="M590 327 L590 670 L640 670" />
  <path class="route" d="M590 327 L590 670 L890 670" />
  <path class="route" d="M590 327 L590 670 L1140 670" />

  <!-- Simple route list (instead of overlapping labels on lines) -->
  <rect x="120" y="430" width="380" height="300" fill="#ffffff" stroke="#93c5fd" stroke-width="2" rx="14" />
  <text x="145" y="462" class="section">Gateway Routes</text>
  <text x="145" y="496" class="meta">/auth/**      → Auth Service</text>
  <text x="145" y="528" class="meta">/users/**     → User Service</text>
  <text x="145" y="560" class="meta">/products/**  → Product Service</text>
  <text x="145" y="592" class="meta">/orders/**    → Order Service</text>
  <text x="145" y="624" class="meta">/payments/**  → Payment Service</text>
  <text x="145" y="656" class="meta">/emails/**    → Email Service</text>
  <text x="145" y="698" class="note">(Routes listed here to keep the lines uncluttered.)</text>

  <!-- Discovery -->
  <path class="discovery" d="M410 280 L920 270" />
  <path class="discovery" d="M750 430 L920 355" />
  <path class="discovery" d="M1000 430 L980 355" />
  <path class="discovery" d="M1250 430 L1080 355" />
  <path class="discovery" d="M750 620 L940 355" />
  <path class="discovery" d="M1000 620 L1000 355" />
  <path class="discovery" d="M1250 620 L1060 355" />

  <!-- Inter-service -->
  <path class="interservice" d="M1110 670 L1140 670" />
  <text x="1125" y="648" text-anchor="middle" class="note">payment → order</text>

  <path class="interservice" d="M1110 645 L1140 530" />
  <text x="1160" y="600" class="note">order → product</text>

  <path class="interservice" d="M750 530 L750 620" />
  <text x="770" y="584" class="note">auth → email</text>

  <!-- Infra dependencies -->
  <path class="infra" d="M860 470 L1600 470" />
  <path class="infra" d="M1110 470 L1600 490" />
  <path class="infra" d="M1360 470 L1600 510" />
  <path class="infra" d="M1110 670 L1600 530" />
  <path class="infra" d="M1360 670 L1600 550" />

  <path class="infra" d="M860 670 L1600 670" />

  <!-- Legend -->
  <rect x="620" y="810" width="910" height="210" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" rx="14" />
  <text x="650" y="850" class="section">Legend</text>

  <line x1="650" y1="890" x2="750" y2="890" class="route" />
  <text x="770" y="896" class="meta">Gateway request flow</text>

  <line x1="650" y1="930" x2="750" y2="930" class="discovery" />
  <text x="770" y="936" class="meta">Service registration/discovery (Eureka)</text>

  <line x1="1080" y1="890" x2="1180" y2="890" class="interservice" />
  <text x="1200" y="896" class="meta">Inter-service call (Feign)</text>

  <line x1="1080" y1="930" x2="1180" y2="930" class="infra" />
  <text x="1200" y="936" class="meta">Database / SMTP dependency</text>

  <text x="650" y="980" class="note">Reading order: left → right for requests, then discovery and dependencies.</text>
</svg>
