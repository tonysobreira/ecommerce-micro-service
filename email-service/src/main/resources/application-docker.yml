server:
  port: 8086

spring:
  application:
    name: email-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,kafka:29092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:email-service}
      auto-offset-reset: earliest
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.example.emailservice.messaging
        spring.json.use.type.headers: false
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:false}
          connectiontimeout: ${MAIL_SMTP_CONNECTION_TIMEOUT:5000}
          timeout: ${MAIL_SMTP_TIMEOUT:5000}
          writetimeout: ${MAIL_SMTP_WRITE_TIMEOUT:5000}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}

app:
  mail:
    from: ${MAIL_FROM:no-reply@ecommerce.local}
  kafka:
    topics:
      activation-email: ${KAFKA_TOPIC_ACTIVATION_EMAIL:email.activation.requested}
      password-reset-email: ${KAFKA_TOPIC_PASSWORD_RESET_EMAIL:email.password-reset.requested}
      order-status-email: ${KAFKA_TOPIC_ORDER_STATUS_EMAIL:email.order-status.requested}

management:
  endpoints:
    web:
      exposure:
        include: health,info
