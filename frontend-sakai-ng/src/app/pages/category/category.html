<div class="card">
    <div class="font-semibold text-xl mb-4">Product List</div>
    <p-table #dt1 [value]="categories()" dataKey="id" responsiveLayout="scroll">
        <ng-template #header>
            <tr>
                <th style="min-width: 12rem">
                    <div class="flex justify-between items-center">
                        Id
                    </div>
                </th>
                <th style="min-width: 12rem">
                    <div class="flex justify-between items-center">
                        Name
                    </div>
                </th>
            </tr>
        </ng-template>
        <ng-template #body let-category>
            <tr>
                <td>
                    {{ category.id }}
                </td>
                <td>
                    {{ category.name }}
                </td>
            </tr>
        </ng-template>
        <ng-template #emptymessage>
            <tr>
                <td colspan="8">No products found.</td>
            </tr>
        </ng-template>
        <ng-template #loadingbody>
            <tr>
                <td colspan="8">Loading products data. Please wait.</td>
            </tr>
        </ng-template>
    </p-table>
</div>
