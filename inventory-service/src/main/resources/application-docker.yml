server:
  port: 8088

spring:
  application:
    name: inventory-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/inventorydb}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://discovery-server:8761/eureka}

security:
  jwt:
    secret: ${JWT_SECRET:dev-jwt-secret-32-bytes-long-123456}
    issuer: ${JWT_ISSUER:ecommerce-ms}

feign:
  client:
    config:
      default:
        connectTimeout: 3000
        readTimeout: 8000

product-service:
  name: ${PRODUCT_SERVICE_NAME:product-service}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  paths-to-exclude: /internal/**
