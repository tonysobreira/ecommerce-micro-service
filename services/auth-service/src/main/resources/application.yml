server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/authdb}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}

security:
  jwt:
    secret: ${JWT_SECRET:dev-jwt-secret-32-bytes-long-123456}
    access-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:30}
    refresh-ttl-days: ${JWT_REFRESH_TTL_DAYS:1}
    issuer: ${JWT_ISSUER:ecommerce-ms}
  activation:
    ttl-minutes: ${ACTIVATION_TTL_MINUTES:30}

app:
  activation:
    base-url: ${ACTIVATION_BASE_URL:http://localhost:8080/auth/activate}
  kafka:
    topics:
      activation-email: ${KAFKA_TOPIC_ACTIVATION_EMAIL:email.activation.requested}
      password-reset-email: ${KAFKA_TOPIC_PASSWORD_RESET_EMAIL:email.password-reset.requested}

management:
  endpoints:
    web:
      exposure:
        include: health,info
